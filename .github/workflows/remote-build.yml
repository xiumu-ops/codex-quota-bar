name: Codex-Quota-Bar Remote Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: remote-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package (Windows Server 2025 x64)
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.project_version.outputs.version }}
    env:
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read and validate project version
        id: project_version
        run: |
          $cmake = Get-Content -LiteralPath "CMakeLists.txt" -Raw
          $match = [regex]::Match(
              $cmake,
              'project\s*\(\s*Codex-Quota-Bar\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)',
              [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if (-not $match.Success) {
              throw "Unable to read the project version from CMakeLists.txt."
          }

          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and
              $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Release tag $env:GITHUB_REF_NAME does not match project version v$version."
          }
          "version=$version" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Project version: $version"

      - name: Show build environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
              throw "vswhere.exe was not found on the runner."
          }

          $vsPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
              throw "The MSVC x64 toolchain was not found on the runner."
          }

          Write-Host "Visual Studio: $vsPath"
          cmake --version

      - name: Import optional code-signing certificate
        id: signing
        if: ${{ github.event_name != 'pull_request' && env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codex-quota-bar-signing.pfx"
          [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

          $password = ConvertTo-SecureString `
              $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          if (-not $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              throw "The code-signing certificate could not be imported."
          }

          "CODEX_QUOTA_SIGN_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_PFX_PATH=$pfxPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run regression tests
        run: .\scripts\test.ps1

      - name: Build release installer
        run: .\scripts\build-installer.ps1

      - name: Verify release output
        run: |
          $installers = @(
              Get-ChildItem "dist\Release\Codex-Quota-Bar_version_*.exe" `
                  -File -ErrorAction Stop)
          $hashFiles = @(
              Get-ChildItem "dist\Release\Codex-Quota-Bar_version_*.sha256" `
                  -File -ErrorAction Stop)

          if ($installers.Count -ne 1) {
              throw "Expected one installer, found $($installers.Count)."
          }
          if ($hashFiles.Count -ne 1) {
              throw "Expected one SHA256 file, found $($hashFiles.Count)."
          }

          $expectedHash = ((Get-Content -LiteralPath $hashFiles[0].FullName -Raw).Trim() `
              -split '\s+')[0].ToUpperInvariant()
          $actualHash = (Get-FileHash -LiteralPath $installers[0].FullName `
              -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($expectedHash -ne $actualHash) {
              throw "Installer SHA256 verification failed."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($env:CODEX_QUOTA_SIGN_CERT_THUMBPRINT -and $signature.Status -ne "Valid") {
              throw "Signed installer verification failed: $($signature.StatusMessage)"
          }

          Write-Host "Installer: $($installers[0].Name)"
          Write-Host "SHA256:   $actualHash"
          Write-Host "Signature: $($signature.Status)"

      - name: Test current-user install and uninstall
        run: .\scripts\test-installer.ps1 -Ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Quota-Bar_version_${{ steps.project_version.outputs.version }}
          path: |
            dist/Release/Codex-Quota-Bar_version_*.exe
            dist/Release/Codex-Quota-Bar_version_*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove imported signing certificate
        if: ${{ always() && steps.signing.outcome == 'success' }}
        run: |
          if ($env:SIGNING_CERT_THUMBPRINT) {
              Remove-Item `
                  "Cert:\CurrentUser\My\$env:SIGNING_CERT_THUMBPRINT" `
                  -Force -ErrorAction SilentlyContinue
          }
          if ($env:SIGNING_PFX_PATH) {
              Remove-Item -LiteralPath $env:SIGNING_PFX_PATH `
                  -Force -ErrorAction SilentlyContinue
          }

  publish-release:
    name: Publish stable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v8
        with:
          name: Codex-Quota-Bar_version_${{ needs.build-test-package.outputs.version }}
          path: release-assets

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build-test-package.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-assets/Codex-Quota-Bar_version_*.exe
            release-assets/Codex-Quota-Bar_version_*.sha256
          )
          if [[ ${#assets[@]} -ne 2 ]]; then
            echo "Expected one installer and one SHA256 file; found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "Codex-Quota-Bar ${RELEASE_VERSION}" \
            --generate-notes \
            --latest
